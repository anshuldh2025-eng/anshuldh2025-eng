<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#111828"/>
    </linearGradient>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC6"/>
      <stop offset="100%" stop-color="#B06EFF"/>
    </linearGradient>
    <pattern id="cg2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1E2D48" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',monospace;}
      .h{font-family:'Space Grotesk',-apple-system,sans-serif;}
      .b{font-family:'Inter',-apple-system,sans-serif;}
    </style>
  </defs>

  <rect width="960" height="220" fill="url(#cb)" rx="8"/>
  <rect width="960" height="220" fill="url(#cg2)" rx="8"/>
  <rect x="1" y="1" width="958" height="218" fill="none" stroke="#1E2D48" stroke-width="1.1" rx="8"/>
  <rect x="1" y="1" width="4" height="218" fill="url(#cg)" rx="2"/>

  <!-- Header -->
  <text x="22" y="32" fill="#00FFC6" font-size="11" font-weight="700" class="m" letter-spacing="1.4">// 03. CAMPUSFIND — PROJECT DETAILS</text>
  <line x1="22" y1="42" x2="938" y2="42" stroke="#1E2D48" stroke-width="0.8"/>

  <!-- Left column: 2 info blocks -->
  <!-- Block: Purpose -->
  <g transform="translate(22, 60)">
    <text x="0" y="0" fill="#6B7FA3" font-size="8.5" font-weight="700" class="m" letter-spacing="1">PURPOSE</text>
    <text x="0" y="18" fill="#C8D6F0" font-size="11" class="b">Centralized portal to report, discover and recover</text>
    <text x="0" y="34" fill="#C8D6F0" font-size="11" class="b">lost items across university campus grounds.</text>
  </g>

  <!-- Block: Architecture -->
  <g transform="translate(22, 120)">
    <text x="0" y="0" fill="#6B7FA3" font-size="8.5" font-weight="700" class="m" letter-spacing="1">ARCHITECTURE</text>
    <text x="0" y="18" fill="#C8D6F0" font-size="11" class="b">Client-side web application — clean user flows,</text>
    <text x="0" y="34" fill="#C8D6F0" font-size="11" class="b">accessibility-focused, responsive layout design.</text>
  </g>

  <!-- Vertical divider -->
  <line x1="460" y1="58" x2="460" y2="200" stroke="#1E2D48" stroke-width="1"/>

  <!-- Right column: 3 stat cells -->
  <!-- Tech Stack -->
  <g transform="translate(482, 60)">
    <text x="0" y="0" fill="#6B7FA3" font-size="8.5" font-weight="700" class="m" letter-spacing="1">TECHNOLOGY STACK</text>
    <g transform="translate(0, 14)" class="m">
      <rect x="0"   y="0" width="68"  height="20" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
      <text x="34"  y="13.5" text-anchor="middle" fill="#C8D6F0" font-size="9" font-weight="600">HTML5</text>
      <rect x="76"  y="0" width="60"  height="20" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
      <text x="106" y="13.5" text-anchor="middle" fill="#C8D6F0" font-size="9" font-weight="600">CSS3</text>
      <rect x="144" y="0" width="120" height="20" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
      <text x="204" y="13.5" text-anchor="middle" fill="#00FFC6" font-size="9" font-weight="600">RESPONSIVE WEB</text>
    </g>
  </g>

  <!-- Phase -->
  <g transform="translate(482, 118)">
    <text x="0" y="0" fill="#6B7FA3" font-size="8.5" font-weight="700" class="m" letter-spacing="1">DEVELOPMENT PHASE</text>
    <rect x="0" y="10" width="142" height="22" rx="3" fill="#0A0E1A" stroke="#00FFC6" stroke-width="0.9"/>
    <circle cx="12" cy="21" r="3.5" fill="#00FFC6"/>
    <text x="24" y="25" fill="#00FFC6" font-size="9" font-weight="700" class="m">IN ACTIVE DEVELOPMENT</text>
  </g>

  <!-- Repository status -->
  <g transform="translate(482, 164)">
    <text x="0" y="0" fill="#6B7FA3" font-size="8.5" font-weight="700" class="m" letter-spacing="1">REPOSITORY</text>
    <rect x="0" y="10" width="104" height="22" rx="3" fill="#0A0E1A" stroke="#1E2D48" stroke-width="0.9"/>
    <text x="52" y="25" text-anchor="middle" fill="#B06EFF" font-size="9" font-weight="700" class="m">COMING SOON</text>

    <rect x="112" y="10" width="96" height="22" rx="3" fill="#0A0E1A" stroke="#1E2D48" stroke-width="0.9"/>
    <text x="160" y="25" text-anchor="middle" fill="#B06EFF" font-size="9" font-weight="700" class="m">DEMO: PENDING</text>
  </g>
</svg>
