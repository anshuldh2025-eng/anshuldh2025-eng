<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="vb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#111828"/>
    </linearGradient>
    <linearGradient id="vg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC6"/>
      <stop offset="100%" stop-color="#B06EFF"/>
    </linearGradient>
    <pattern id="vg2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1E2D48" stroke-width="0.5" opacity="0.35"/>
    </pattern>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',monospace;}
      .b{font-family:'Inter',-apple-system,sans-serif;}
    </style>
  </defs>

  <rect width="960" height="220" fill="url(#vb)" rx="8"/>
  <rect width="960" height="220" fill="url(#vg2)" rx="8"/>
  <rect x="1" y="1" width="958" height="218" fill="none" stroke="#1E2D48" stroke-width="1.1" rx="8"/>
  <rect x="1" y="1" width="4" height="218" fill="url(#vg)" rx="2"/>

  <!-- Header -->
  <text x="22" y="32" fill="#00FFC6" font-size="11" font-weight="700" class="m" letter-spacing="1.4">// 04. AI/ML VISION — CAREER AMBITION</text>
  <line x1="22" y1="42" x2="938" y2="42" stroke="#1E2D48" stroke-width="0.8"/>

  <!-- 4 vision pillars -->
  <!-- Pillar 1 -->
  <g transform="translate(22, 62)">
    <rect x="0" y="0" width="4" height="130" fill="#00FFC6" rx="2"/>
    <text x="16" y="18"  fill="#00FFC6" font-size="9" font-weight="700" class="m" letter-spacing="1">FOUNDATIONAL RIGOR</text>
    <text x="16" y="38"  fill="#C8D6F0" font-size="11" class="b">Multivariable calculus, linear algebra,</text>
    <text x="16" y="55"  fill="#C8D6F0" font-size="11" class="b">probability &amp; optimization theory.</text>
    <text x="16" y="80"  fill="#6B7FA3" font-size="9.5" class="m">The mathematics governing</text>
    <text x="16" y="96"  fill="#6B7FA3" font-size="9.5" class="m">every neural transformation.</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(262, 62)">
    <rect x="0" y="0" width="4" height="130" fill="#B06EFF" rx="2"/>
    <text x="16" y="18"  fill="#B06EFF" font-size="9" font-weight="700" class="m" letter-spacing="1">REPRESENTATION MODELING</text>
    <text x="16" y="38"  fill="#C8D6F0" font-size="11" class="b">Deep latent spaces, decision</text>
    <text x="16" y="55"  fill="#C8D6F0" font-size="11" class="b">boundaries &amp; embeddings.</text>
    <text x="16" y="80"  fill="#6B7FA3" font-size="9.5" class="m">How models learn compact</text>
    <text x="16" y="96"  fill="#6B7FA3" font-size="9.5" class="m">multi-dimensional structure.</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(502, 62)">
    <rect x="0" y="0" width="4" height="130" fill="#00FFC6" rx="2"/>
    <text x="16" y="18"  fill="#00FFC6" font-size="9" font-weight="700" class="m" letter-spacing="1">ADVANCED COMPUTING</text>
    <text x="16" y="38"  fill="#C8D6F0" font-size="11" class="b">Accelerated computing, parallelised</text>
    <text x="16" y="55"  fill="#C8D6F0" font-size="11" class="b">tensor ops &amp; hardware co-design.</text>
    <text x="16" y="80"  fill="#6B7FA3" font-size="9.5" class="m">Independent academic interest —</text>
    <text x="16" y="96"  fill="#6B7FA3" font-size="9.5" class="m">no corporate affiliation.</text>
  </g>

  <!-- Pillar 4 -->
  <g transform="translate(742, 62)">
    <rect x="0" y="0" width="4" height="130" fill="#B06EFF" rx="2"/>
    <text x="16" y="18"  fill="#B06EFF" font-size="9" font-weight="700" class="m" letter-spacing="1">ENGINEERING DISCIPLINE</text>
    <text x="16" y="38"  fill="#C8D6F0" font-size="11" class="b">Clean, testable, maintainable</text>
    <text x="16" y="55"  fill="#C8D6F0" font-size="11" class="b">production-grade codebases.</text>
    <text x="16" y="80"  fill="#6B7FA3" font-size="9.5" class="m">Theory translated faithfully</text>
    <text x="16" y="96"  fill="#6B7FA3" font-size="9.5" class="m">into working software.</text>
  </g>

  <!-- Bottom tag -->
  <line x1="22" y1="200" x2="938" y2="200" stroke="#1E2D48" stroke-width="0.7"/>
  <text x="22" y="215" fill="#6B7FA3" font-size="8.5" class="m">GOAL: ASPIRING AI/ML ENGINEER  ·  TRAJECTORY: ACTIVE LEARNING  ·  HORIZON: ADVANCED AI SYSTEMS</text>
</svg>
