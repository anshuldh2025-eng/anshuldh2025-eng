<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="nnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#111828" />
    </linearGradient>

    <radialGradient id="nnMintRad" cx="18%" cy="28%" r="50%">
      <stop offset="0%" stop-color="#00FFC6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="nnPurpRad" cx="78%" cy="68%" r="52%">
      <stop offset="0%" stop-color="#B06EFF" stop-opacity="0.13" />
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0" />
    </radialGradient>

    <pattern id="nnGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#1E2D48" stroke-width="0.5" stroke-opacity="0.45" />
    </pattern>

    <filter id="gN" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',monospace; }
      .h { font-family: 'Space Grotesk',-apple-system,sans-serif; }

      @keyframes sp {
        0%  { stroke-dashoffset: 180; opacity: 0.14; }
        50% { opacity: 0.94; }
        100%{ stroke-dashoffset: 0;   opacity: 0.14; }
      }
      @keyframes ng {
        0%,100%{ transform:scale(1);   filter:drop-shadow(0 0 2px #00FFC6); }
        50%    { transform:scale(1.2); filter:drop-shadow(0 0 8px #00FFC6); }
      }
      @keyframes pg {
        0%,100%{ transform:scale(1);    filter:drop-shadow(0 0 2px #B06EFF); }
        50%    { transform:scale(1.24); filter:drop-shadow(0 0 9px #B06EFF); }
      }
      .syn { stroke-dasharray:6 13; animation:sp 4.8s linear infinite; }
      .pc  { transform-origin:center; animation:ng 3.5s ease-in-out infinite; }
      .pp  { transform-origin:center; animation:pg 4.1s ease-in-out infinite; }

      @media (prefers-reduced-motion:reduce){
        .syn,.pc,.pp{ animation:none !important; }
      }
    </style>
  </defs>

  <rect width="850" height="440" fill="url(#nnBg)" rx="6" />
  <rect width="850" height="440" fill="url(#nnMintRad)" rx="6" />
  <rect width="850" height="440" fill="url(#nnPurpRad)" rx="6" />
  <rect width="850" height="440" fill="url(#nnGrid)" rx="6" />
  <rect x="1" y="1" width="848" height="438" fill="none" stroke="#1E2D48" stroke-width="1.1" rx="6" />

  <!-- Corner accents -->
  <path d="M 1 26 L 1 1 L 26 1" fill="none" stroke="#00FFC6" stroke-width="2" />
  <path d="M 849 26 L 849 1 L 824 1" fill="none" stroke="#00FFC6" stroke-width="2" />
  <path d="M 1 414 L 1 439 L 26 439" fill="none" stroke="#00FFC6" stroke-width="2" />
  <path d="M 849 414 L 849 439 L 824 439" fill="none" stroke="#00FFC6" stroke-width="2" />

  <!-- Header -->
  <text x="34" y="30" fill="#00FFC6" font-size="11" font-weight="700" class="m" letter-spacing="1.4">ARTIFICIAL INTELLIGENCE // DEEP REPRESENTATION GRAPH</text>
  <text x="816" y="30" text-anchor="end" fill="#6B7FA3" font-size="9.5" class="m">COMPUTATIONAL TOPOLOGY</text>
  <line x1="34" y1="40" x2="816" y2="40" stroke="#1E2D48" stroke-width="0.8" />

  <!-- Layer labels — evenly spaced, font smaller to avoid crowding -->
  <g class="m" font-size="9" fill="#6B7FA3">
    <g transform="translate(90, 68)">
      <text x="0" y="0" text-anchor="middle" fill="#00FFC6" font-weight="600">INPUT</text>
      <text x="0" y="13" text-anchor="middle" font-size="7.5">X ∈ ℝ⁴</text>
    </g>
    <g transform="translate(252, 68)">
      <text x="0" y="0" text-anchor="middle" fill="#B06EFF" font-weight="600">FEATURE MAP</text>
      <text x="0" y="13" text-anchor="middle" font-size="7.5">H₁=ReLU(W₁X+b₁)</text>
    </g>
    <g transform="translate(425, 68)">
      <text x="0" y="0" text-anchor="middle" fill="#00FFC6" font-weight="600">DEEP LATENT</text>
      <text x="0" y="13" text-anchor="middle" font-size="7.5">H₂=ReLU(W₂H₁+b₂)</text>
    </g>
    <g transform="translate(597, 68)">
      <text x="0" y="0" text-anchor="middle" fill="#B06EFF" font-weight="600">BOTTLENECK</text>
      <text x="0" y="13" text-anchor="middle" font-size="7.5">Z=W₃H₂+b₃</text>
    </g>
    <g transform="translate(748, 68)">
      <text x="0" y="0" text-anchor="middle" fill="#00FFC6" font-weight="600">PREDICTION</text>
      <text x="0" y="13" text-anchor="middle" font-size="7.5">ŷ=Softmax(Z)</text>
    </g>
  </g>

  <!-- Passive connections -->
  <!-- L0 (x=90, y=130,185,245,305) → L1 (x=252, y=118,166,214,262,310) -->
  <g stroke="#1E2D48" stroke-width="0.9" opacity="0.55">
    <line x1="90" y1="130" x2="252" y2="118"/><line x1="90" y1="130" x2="252" y2="166"/>
    <line x1="90" y1="185" x2="252" y2="118"/><line x1="90" y1="185" x2="252" y2="166"/><line x1="90" y1="185" x2="252" y2="214"/>
    <line x1="90" y1="245" x2="252" y2="166"/><line x1="90" y1="245" x2="252" y2="214"/><line x1="90" y1="245" x2="252" y2="262"/>
    <line x1="90" y1="305" x2="252" y2="214"/><line x1="90" y1="305" x2="252" y2="262"/><line x1="90" y1="305" x2="252" y2="310"/>

    <!-- L1→L2 (x=425, y=110,154,198,242,286,330) -->
    <line x1="252" y1="118" x2="425" y2="110"/><line x1="252" y1="118" x2="425" y2="154"/>
    <line x1="252" y1="166" x2="425" y2="110"/><line x1="252" y1="166" x2="425" y2="154"/><line x1="252" y1="166" x2="425" y2="198"/>
    <line x1="252" y1="214" x2="425" y2="154"/><line x1="252" y1="214" x2="425" y2="198"/><line x1="252" y1="214" x2="425" y2="242"/>
    <line x1="252" y1="262" x2="425" y2="198"/><line x1="252" y1="262" x2="425" y2="242"/><line x1="252" y1="262" x2="425" y2="286"/>
    <line x1="252" y1="310" x2="425" y2="242"/><line x1="252" y1="310" x2="425" y2="286"/><line x1="252" y1="310" x2="425" y2="330"/>

    <!-- L2→L3 (x=597, y=148,222,296) -->
    <line x1="425" y1="110" x2="597" y2="148"/><line x1="425" y1="110" x2="597" y2="222"/>
    <line x1="425" y1="154" x2="597" y2="148"/><line x1="425" y1="154" x2="597" y2="222"/>
    <line x1="425" y1="198" x2="597" y2="148"/><line x1="425" y1="198" x2="597" y2="222"/><line x1="425" y1="198" x2="597" y2="296"/>
    <line x1="425" y1="242" x2="597" y2="148"/><line x1="425" y1="242" x2="597" y2="222"/><line x1="425" y1="242" x2="597" y2="296"/>
    <line x1="425" y1="286" x2="597" y2="222"/><line x1="425" y1="286" x2="597" y2="296"/>
    <line x1="425" y1="330" x2="597" y2="222"/><line x1="425" y1="330" x2="597" y2="296"/>

    <!-- L3→Output (x=748, y=180,260) -->
    <line x1="597" y1="148" x2="748" y2="180"/><line x1="597" y1="148" x2="748" y2="260"/>
    <line x1="597" y1="222" x2="748" y2="180"/><line x1="597" y1="222" x2="748" y2="260"/>
    <line x1="597" y1="296" x2="748" y2="180"/><line x1="597" y1="296" x2="748" y2="260"/>
  </g>

  <!-- Active signal paths -->
  <path d="M 90 185 L 252 166 L 425 198 L 597 222 L 748 180" fill="none" stroke="#00FFC6" stroke-width="2" class="syn" filter="url(#gN)" />
  <path d="M 90 245 L 252 214 L 425 242 L 597 222 L 748 260" fill="none" stroke="#B06EFF" stroke-width="2" class="syn" style="animation-delay:-2s" filter="url(#gN)" />
  <path d="M 90 130 L 252 118 L 425 154 L 597 148 L 748 180" fill="none" stroke="#00FFC6" stroke-width="1.5" class="syn" opacity="0.7" style="animation-delay:-3.4s" />

  <!-- NODES: Input -->
  <g fill="#00FFC6">
    <circle cx="90" cy="130" r="5" class="pc" />
    <circle cx="90" cy="185" r="6" class="pc" style="animation-delay:-0.6s" />
    <circle cx="90" cy="185" r="11" fill="none" stroke="#00FFC6" stroke-width="0.8" opacity="0.55" />
    <circle cx="90" cy="245" r="5" class="pc" style="animation-delay:-1.2s" />
    <circle cx="90" cy="305" r="5" class="pc" style="animation-delay:-1.8s" />
  </g>

  <!-- NODES: L1 -->
  <g fill="#B06EFF">
    <circle cx="252" cy="118" r="5.5" class="pp" style="animation-delay:-0.4s" />
    <circle cx="252" cy="166" r="6.5" class="pp" filter="url(#gN)" style="animation-delay:-1.1s" />
    <circle cx="252" cy="214" r="6.5" class="pp" style="animation-delay:-1.8s" />
    <circle cx="252" cy="262" r="5.5" class="pp" style="animation-delay:-2.3s" />
    <circle cx="252" cy="310" r="5"   class="pp" style="animation-delay:-0.9s" />
  </g>

  <!-- NODES: L2 -->
  <g fill="#00FFC6">
    <circle cx="425" cy="110" r="5.5" class="pc" style="animation-delay:-1.4s" />
    <circle cx="425" cy="154" r="6"   class="pc" style="animation-delay:-0.7s" />
    <circle cx="425" cy="198" r="7.5" class="pc" filter="url(#gN)" style="animation-delay:-2.1s" />
    <circle cx="425" cy="198" r="13"  fill="none" stroke="#00FFC6" stroke-width="1" opacity="0.65" />
    <circle cx="425" cy="242" r="6.5" class="pc" style="animation-delay:-1.6s" />
    <circle cx="425" cy="286" r="5.5" class="pc" style="animation-delay:-0.2s" />
    <circle cx="425" cy="330" r="5"   class="pc" style="animation-delay:-2.8s" />
  </g>

  <!-- NODES: L3 -->
  <g fill="#B06EFF">
    <circle cx="597" cy="148" r="6.5" class="pp" style="animation-delay:-1.3s" />
    <circle cx="597" cy="222" r="7.5" class="pp" filter="url(#gN)" style="animation-delay:-0.5s" />
    <circle cx="597" cy="222" r="14"  fill="none" stroke="#B06EFF" stroke-width="1.1" opacity="0.65" />
    <circle cx="597" cy="296" r="6"   class="pp" style="animation-delay:-2.5s" />
  </g>

  <!-- NODES: Output -->
  <g fill="#00FFC6">
    <circle cx="748" cy="180" r="7"   class="pc" filter="url(#gN)" />
    <circle cx="748" cy="180" r="13"  fill="none" stroke="#00FFC6" stroke-width="1.2" opacity="0.7" />
    <circle cx="748" cy="260" r="6.5" class="pc" style="animation-delay:-1.5s" />
    <circle cx="748" cy="260" r="12"  fill="none" stroke="#00FFC6" stroke-width="1" opacity="0.5" />
  </g>

  <!-- Bottom strip — fits within 850 width with breathing room -->
  <line x1="34" y1="385" x2="816" y2="385" stroke="#1E2D48" stroke-width="0.7" />
  <g transform="translate(34, 400)" class="m" font-size="9.5">
    <text x="0"   y="0" fill="#6B7FA3">OPTIMIZATION: ∇θ J(θ)</text>
    <text x="230" y="0" fill="#C8D6F0">ACTIVATIONS: LeakyReLU · Softmax</text>
    <text x="510" y="0" fill="#00FFC6">ADVANCED COMPUTING ARCHITECTURE</text>
  </g>
</svg>
