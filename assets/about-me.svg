<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 310" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="ab" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#111828"/>
    </linearGradient>
    <linearGradient id="ag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00FFC6"/>
      <stop offset="100%" stop-color="#B06EFF"/>
    </linearGradient>
    <pattern id="ag2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#1E2D48" stroke-width="0.5" opacity="0.4"/>
    </pattern>
    <style>
      .m{font-family:'JetBrains Mono','Fira Code',monospace;}
      .h{font-family:'Space Grotesk',-apple-system,sans-serif;}
      .b{font-family:'Inter',-apple-system,sans-serif;}
    </style>
  </defs>

  <rect width="960" height="310" fill="url(#ab)" rx="8"/>
  <rect width="960" height="310" fill="url(#ag2)" rx="8"/>
  <rect x="1" y="1" width="958" height="308" fill="none" stroke="#1E2D48" stroke-width="1.1" rx="8"/>
  <rect x="1" y="1" width="4" height="308" fill="url(#ag)" rx="2"/>

  <!-- Section header -->
  <text x="22" y="34" fill="#00FFC6" font-size="11" font-weight="700" class="m" letter-spacing="1.4">// 01. ABOUT ME</text>
  <line x1="22" y1="44" x2="938" y2="44" stroke="#1E2D48" stroke-width="0.8"/>

  <!-- Intro text -->
  <text x="22" y="68" fill="#C8D6F0" font-size="12" class="b">Undergraduate pursuing <tspan font-weight="700" fill="#00FFC6">B.Tech CSE — Artificial Intelligence &amp; Machine Learning.</tspan></text>
  <text x="22" y="88" fill="#6B7FA3" font-size="11.5" class="b">Building programming fundamentals, exploring AI/ML mathematics, and developing practical software projects.</text>

  <!-- 4 pillar cards — y=108, card height=172, card width=222, gap=10 -->

  <!-- CARD 1: Artificial Intelligence -->
  <g transform="translate(22, 108)">
    <rect width="222" height="172" rx="6" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
    <rect x="0" y="0" width="222" height="4" fill="#00FFC6" rx="2"/>
    <text x="12" y="30" fill="#00FFC6" font-size="9" font-weight="700" class="m" letter-spacing="1">ARTIFICIAL INTELLIGENCE</text>
    <line x1="12" y1="38" x2="210" y2="38" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="58"  fill="#6B7FA3" font-size="10.5" class="b">Intelligent systems</text>
    <text x="12" y="75"  fill="#6B7FA3" font-size="10.5" class="b">Search mechanics</text>
    <text x="12" y="92"  fill="#6B7FA3" font-size="10.5" class="b">Heuristic evaluation</text>
    <text x="12" y="109" fill="#6B7FA3" font-size="10.5" class="b">Computational modeling</text>
    <line x1="12" y1="130" x2="210" y2="130" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="148" fill="#C8D6F0" font-size="9" class="m">STATUS: THEORETICAL STUDY</text>
  </g>

  <!-- CARD 2: Machine Learning -->
  <g transform="translate(254, 108)">
    <rect width="222" height="172" rx="6" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
    <rect x="0" y="0" width="222" height="4" fill="#B06EFF" rx="2"/>
    <text x="12" y="30" fill="#B06EFF" font-size="9" font-weight="700" class="m" letter-spacing="1">MACHINE LEARNING</text>
    <line x1="12" y1="38" x2="210" y2="38" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="58"  fill="#6B7FA3" font-size="10.5" class="b">Statistical learning algorithms</text>
    <text x="12" y="75"  fill="#6B7FA3" font-size="10.5" class="b">Data preparation pipelines</text>
    <text x="12" y="92"  fill="#6B7FA3" font-size="10.5" class="b">Evaluation &amp; metrics</text>
    <text x="12" y="109" fill="#6B7FA3" font-size="10.5" class="b">Supervised learning methods</text>
    <line x1="12" y1="130" x2="210" y2="130" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="148" fill="#C8D6F0" font-size="9" class="m">STATUS: FOUNDATIONAL STUDY</text>
  </g>

  <!-- CARD 3: Software Development -->
  <g transform="translate(486, 108)">
    <rect width="222" height="172" rx="6" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
    <rect x="0" y="0" width="222" height="4" fill="#00FFC6" rx="2"/>
    <text x="12" y="30" fill="#00FFC6" font-size="9" font-weight="700" class="m" letter-spacing="1">SOFTWARE DEVELOPMENT</text>
    <line x1="12" y1="38" x2="210" y2="38" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="58"  fill="#6B7FA3" font-size="10.5" class="b">Procedural &amp; OOP paradigms</text>
    <text x="12" y="75"  fill="#6B7FA3" font-size="10.5" class="b">Algorithm complexity</text>
    <text x="12" y="92"  fill="#6B7FA3" font-size="10.5" class="b">Memory &amp; pointer semantics</text>
    <text x="12" y="109" fill="#6B7FA3" font-size="10.5" class="b">Python · C · C++ stack</text>
    <line x1="12" y1="130" x2="210" y2="130" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="148" fill="#C8D6F0" font-size="9" class="m">STATUS: IN PROGRESS</text>
  </g>

  <!-- CARD 4: Web Technologies -->
  <g transform="translate(718, 108)">
    <rect width="220" height="172" rx="6" fill="#111828" stroke="#1E2D48" stroke-width="1"/>
    <rect x="0" y="0" width="220" height="4" fill="#B06EFF" rx="2"/>
    <text x="12" y="30" fill="#B06EFF" font-size="9" font-weight="700" class="m" letter-spacing="1">WEB TECHNOLOGIES</text>
    <line x1="12" y1="38" x2="208" y2="38" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="58"  fill="#6B7FA3" font-size="10.5" class="b">Semantic HTML5 markup</text>
    <text x="12" y="75"  fill="#6B7FA3" font-size="10.5" class="b">CSS3 responsive layouts</text>
    <text x="12" y="92"  fill="#6B7FA3" font-size="10.5" class="b">Accessible UI structure</text>
    <text x="12" y="109" fill="#6B7FA3" font-size="10.5" class="b">Interface prototyping</text>
    <line x1="12" y1="130" x2="208" y2="130" stroke="#1E2D48" stroke-width="0.7"/>
    <text x="12" y="148" fill="#C8D6F0" font-size="9" class="m">STATUS: IN PROGRESS</text>
  </g>
</svg>
