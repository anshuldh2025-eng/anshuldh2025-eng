<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" width="100%" height="auto" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="cBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#111828" />
    </linearGradient>

    <radialGradient id="cGlow" cx="78%" cy="38%" r="50%">
      <stop offset="0%" stop-color="#00FFC6" stop-opacity="0.11" />
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0" />
    </radialGradient>

    <pattern id="cGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E2D48" stroke-width="0.5" stroke-opacity="0.3" />
    </pattern>

    <style>
      .m { font-family: 'JetBrains Mono','Fira Code',monospace; }
      .h { font-family: 'Space Grotesk',-apple-system,sans-serif; }
      .b { font-family: 'Inter',-apple-system,sans-serif; }

      @keyframes ring {
        0%   { r: 4;  opacity: 1; }
        100% { r: 16; opacity: 0; }
      }
      .ra { animation: ring 2.4s cubic-bezier(.2,.8,.2,1) infinite; }

      @keyframes rad {
        0%   { transform: rotate(0deg);   }
        100% { transform: rotate(360deg); }
      }
      .rs { transform-origin: 710px 145px; animation: rad 8s linear infinite; }

      @media (prefers-reduced-motion:reduce){
        .ra,.rs { animation:none !important; }
      }
    </style>
  </defs>

  <rect width="850" height="290" fill="url(#cBg)" rx="8" />
  <rect width="850" height="290" fill="url(#cGlow)" rx="8" />
  <rect width="850" height="290" fill="url(#cGrid)" rx="8" />
  <rect x="1" y="1" width="848" height="288" fill="none" stroke="#1E2D48" stroke-width="1.2" rx="8" />

  <!-- Corner accents -->
  <path d="M 1 20 L 1 1 L 20 1" fill="none" stroke="#00FFC6" stroke-width="2.4" />
  <path d="M 849 20 L 849 1 L 830 1" fill="none" stroke="#00FFC6" stroke-width="2.4" />
  <path d="M 1 270 L 1 289 L 20 289" fill="none" stroke="#00FFC6" stroke-width="2.4" />
  <path d="M 849 270 L 849 289 L 830 289" fill="none" stroke="#00FFC6" stroke-width="2.4" />

  <!-- Left accent stripe -->
  <rect x="1" y="1" width="4" height="288" rx="2" fill="url(#cBg)" />
  <line x1="4" y1="40" x2="4" y2="250" stroke="#00FFC6" stroke-width="2.5" />

  <!-- Status badge row -->
  <g transform="translate(22, 22)">
    <!-- Status pill -->
    <rect width="175" height="22" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1" />
    <circle cx="11" cy="11" r="3.5" fill="#00FFC6" />
    <text x="22" y="15" fill="#00FFC6" font-size="9" font-weight="700" class="m" letter-spacing="0.8">STATUS: IN DEVELOPMENT</text>

    <!-- Subtitle — safely after pill -->
    <text x="185" y="15" fill="#6B7FA3" font-size="10" class="m" letter-spacing="1">// CAMPUS LOST &amp; FOUND PORTAL</text>
  </g>

  <!-- Project title -->
  <text x="22" y="90" fill="#C8D6F0" font-size="36" font-weight="800" class="h" letter-spacing="0.8">CampusFind</text>

  <!-- Description lines — y spacing 22px, font 12.5 -->
  <text x="22" y="122" fill="#6B7FA3" font-size="12.5" class="b">A web-based platform designed to help students report, discover and recover</text>
  <text x="22" y="140" fill="#6B7FA3" font-size="12.5" class="b">lost items within their college campus.</text>

  <!-- Tech pills row -->
  <g transform="translate(22, 162)" class="m">
    <rect x="0"   y="0" width="68"  height="22" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1" />
    <text x="34"  y="15" text-anchor="middle" fill="#C8D6F0" font-size="9.5" font-weight="600">HTML5</text>

    <rect x="76"  y="0" width="62"  height="22" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1" />
    <text x="107" y="15" text-anchor="middle" fill="#C8D6F0" font-size="9.5" font-weight="600">CSS3</text>

    <rect x="146" y="0" width="128" height="22" rx="3" fill="#111828" stroke="#1E2D48" stroke-width="1" />
    <text x="210" y="15" text-anchor="middle" fill="#00FFC6" font-size="9.5" font-weight="600">RESPONSIVE WEB</text>
  </g>

  <!-- Action strip -->
  <g transform="translate(22, 206)" class="m">
    <rect x="0"   y="0" width="190" height="26" rx="4" fill="#0A0E1A" stroke="#1E2D48" stroke-width="1" />
    <text x="12"  y="17" fill="#6B7FA3" font-size="9.5">REPO: </text>
    <text x="54"  y="17" fill="#00FFC6" font-size="9.5" font-weight="700">COMING SOON</text>

    <rect x="202" y="0" width="190" height="26" rx="4" fill="#0A0E1A" stroke="#1E2D48" stroke-width="1" />
    <text x="214" y="17" fill="#6B7FA3" font-size="9.5">DEMO: </text>
    <text x="258" y="17" fill="#B06EFF" font-size="9.5" font-weight="700">SCHEDULED</text>
  </g>

  <!-- Right: Radar decoration — centered at x=710, y=145 (card height=290) -->
  <g transform="translate(710, 145)">
    <circle cx="0" cy="0" r="68"  fill="none" stroke="#1E2D48" stroke-width="1" />
    <circle cx="0" cy="0" r="48"  fill="none" stroke="#1E2D48" stroke-width="0.8" />
    <circle cx="0" cy="0" r="28"  fill="none" stroke="#1E2D48" stroke-width="0.8" />
    <circle cx="0" cy="0" r="11"  fill="#111828" stroke="#00FFC6" stroke-width="1.1" />

    <line x1="-78" y1="0" x2="78" y2="0" stroke="#1E2D48" stroke-width="0.8" stroke-dasharray="2 3" />
    <line x1="0" y1="-78" x2="0" y2="78" stroke="#1E2D48" stroke-width="0.8" stroke-dasharray="2 3" />

    <!-- Radar sweep -->
    <g class="rs">
      <line x1="0" y1="0" x2="68" y2="0" stroke="#00FFC6" stroke-width="1.4" opacity="0.8" />
      <path d="M 0 0 L 68 0 A 68 68 0 0 0 48 -48 Z" fill="#00FFC6" fill-opacity="0.08" />
    </g>

    <!-- Blip nodes -->
    <g transform="translate(-22, -24)">
      <circle cx="0" cy="0" r="3.5" fill="#00FFC6" />
      <circle cx="0" cy="0" r="8"   fill="none" stroke="#00FFC6" stroke-width="0.7" opacity="0.5" class="ra" />
    </g>
    <g transform="translate(32, 20)">
      <circle cx="0" cy="0" r="3"   fill="#B06EFF" />
      <circle cx="0" cy="0" r="7"   fill="none" stroke="#B06EFF" stroke-width="0.7" opacity="0.5" class="ra" style="animation-delay:-1.2s" />
    </g>
    <g transform="translate(-30, 36)">
      <circle cx="0" cy="0" r="2.5" fill="#00FFC6" opacity="0.75" />
    </g>

    <!-- Label -->
    <text x="0" y="90" text-anchor="middle" fill="#6B7FA3" font-size="8" class="m">PORTAL_RADAR // ACTIVE</text>
  </g>

  <!-- Bottom divider -->
  <line x1="22" y1="246" x2="610" y2="246" stroke="#1E2D48" stroke-width="0.7" />
  <text x="22" y="263" fill="#6B7FA3" font-size="8.5" class="m">PROJECT_ID: CAMPUSFIND-001  ·  PHASE: ACTIVE DEVELOPMENT</text>
</svg>
